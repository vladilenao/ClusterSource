[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-source"
version = "0.1.0"
description = "Realtime tick data collector from T-Investments API with hybrid SQLite + Parquet storage"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2",
    "truststore>=0.8",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
sdk = [
    "t-tech-investments>=1.49,<2.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
    "cluster-source[test]",
    "cluster-source[sdk]",
]

[project.scripts]
cluster-source = "cluster_source.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cluster_source = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
mypy_path = "stubs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
